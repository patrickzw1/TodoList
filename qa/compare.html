<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>TodoList design QA comparison</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; color: #20242a; background: #e9edf3; font-family: system-ui, sans-serif; }
      h1 { margin: 0 0 18px; font-size: 20px; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
      .panel { overflow: hidden; border: 1px solid #cdd3dc; border-radius: 10px; background: white; }
      .panel h2 { margin: 0; padding: 10px 13px; border-bottom: 1px solid #e2e6ec; font-size: 13px; }
      .viewport { position: relative; aspect-ratio: 1.5; overflow: hidden; background: white; }
      .source img { width: 127.3%; height: 100%; object-fit: fill; object-position: left top; }
      .implementation img { width: 100%; height: 100%; object-fit: fill; }
      .sticky { display: grid; grid-template-columns: 360px 1fr; gap: 18px; margin-top: 18px; }
      .sticky-frame { width: 360px; height: 330px; overflow: hidden; }
      .sticky img { width: 1280px; height: 720px; max-width: none; object-fit: fill; }
      .notes { padding: 18px; border: 1px solid #cdd3dc; border-radius: 10px; background: white; font-size: 13px; line-height: 1.7; }
    </style>
  </head>
  <body>
    <h1>TodoList 主界面：选定视觉与当前实现</h1>
    <div class="grid">
      <section class="panel source"><h2>视觉来源：前三栏应用区域</h2><div class="viewport"><img src="./source-reference.png" alt="source visual" /></div></section>
      <section class="panel implementation"><h2>当前实现：1280 × 720</h2><div class="viewport"><img src="./implementation-main.png" alt="implementation" /></div></section>
    </div>
    <div class="sticky">
      <section class="panel"><h2>新增桌面便签：360 × 330</h2><div class="sticky-frame"><img src="./implementation-sticky.png" alt="sticky implementation" /></div></section>
      <div class="notes"><strong>有意差异</strong><br />移除了交互说明列、“开始任务”和“交给 Codex”；新增用户主动控制的桌面置顶便签。主窗口保持左侧导航、分组任务列表与右侧详情的结构和密度。</div>
    </div>
  </body>
</html>
