[package]
name = "todolist-desktop"
version = "0.2.2"
description = "Local-first TodoList desktop app with optional MCP integration"
authors = ["TodoList contributors"]
edition = "2021"

[lib]
name = "todolist_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
production = ["task-store-sqlite/production"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
dirs = "6"
tempfile = "3"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-process = "2"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
task-core = { path = "../crates/task-core" }
task-store-sqlite = { path = "../crates/task-store-sqlite" }
toml_edit = "0.22"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
