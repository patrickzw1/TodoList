name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Frontend, Rust, channels and Sites
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.13.0
          cache: npm

      - name: Select the pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.98.0 --profile minimal --no-self-update
          rustup default 1.98.0
          rustc --version
          cargo --version

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run frontend application tests
        run: npm run test:app

      - name: Verify build-channel isolation
        run: npm run test:channels

      - name: Test release automation contract
        run: npm run test:release-automation

      - name: Parse release PowerShell scripts
        run: npm run test:release-powershell

      - name: Build frontend and Sites output
        run: npm run build

      - name: Test Sites worker contract
        run: npm run test:sites

      - name: Prepare development MCP sidecar for desktop tests
        run: npm run build:sidecar

      - name: Run Rust workspace tests
        run: cargo test --workspace --locked --no-fail-fast
